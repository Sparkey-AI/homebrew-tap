# Sync Formula/sparkey.rb from the public release mirror.
#
# The Sparkey source repo is private and org policy disables deploy keys, so
# the release pipeline cannot push here. Instead this tap pulls: the mirror's
# latest.json (written by the release pipeline) is the source of truth for the
# current version and the per-platform SHA256s.
#
# main is protected by the org-standard ruleset (PRs mandatory, one approval),
# so the sync opens a `formula/v<version>` pull request instead of pushing to
# main. GitHub Actions cannot bypass the ruleset and the org blocks
# GITHUB_TOKEN-created PRs, so the PR is opened with TAP_SYNC_TOKEN — a
# fine-grained PAT scoped to this repo only (contents + pull requests: write).
name: Sync formula
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials off: checkout's stored GITHUB_TOKEN header would
      # otherwise override the PAT in the push URL (push denied to
      # github-actions[bot]).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Render the formula for the mirror's latest version
        id: render
        run: |
          set -euo pipefail
          curl -fsSL https://install.sparkey.ai/latest.json -o /tmp/latest.json
          VERSION=$(jq -r '.latest_version // empty' /tmp/latest.json)
          sha() { jq -r --arg a "$1" '.assets[$a].sha256 // empty' /tmp/latest.json; }
          DARM=$(sha sparkey-darwin-arm64); DX64=$(sha sparkey-darwin-x64)
          LARM=$(sha sparkey-linux-arm64);  LX64=$(sha sparkey-linux-x64)
          if [ -z "$VERSION" ] || [ -z "$DARM" ] || [ -z "$DX64" ] || [ -z "$LARM" ] || [ -z "$LX64" ]; then
            echo "mirror latest.json missing version or a sha — skipping"; exit 0
          fi
          CURRENT=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/sparkey.rb 2>/dev/null || true)
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "tap already at $VERSION"; exit 0
          fi
          BASE="https://install.sparkey.ai/v${VERSION}"
          cat > Formula/sparkey.rb <<RUBY
          class Sparkey < Formula
            desc "Capture coding-agent sessions from Claude Code, Cursor, Codex, and more"
            homepage "https://sparkey.ai"
            version "${VERSION}"
            license :cannot_represent

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE}/sparkey-darwin-arm64"
                sha256 "${DARM}"
              else
                url "${BASE}/sparkey-darwin-x64"
                sha256 "${DX64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE}/sparkey-linux-arm64"
                sha256 "${LARM}"
              else
                url "${BASE}/sparkey-linux-x64"
                sha256 "${LX64}"
              end
            end

            def install
              bin.install Dir["sparkey-*"].first => "sparkey"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/sparkey version")
            end
          end
          RUBY
          sed -i 's/^          //' Formula/sparkey.rb
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Open a pull request with the new formula
        if: steps.render.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.TAP_SYNC_TOKEN }}
          VERSION: ${{ steps.render.outputs.version }}
        run: |
          set -euo pipefail
          # A secret pasted with a trailing newline breaks both the push URL
          # ("Malformed input to a URL function") and gh's auth header — strip
          # every whitespace character before the token is used anywhere.
          GH_TOKEN="$(printf '%s' "${GH_TOKEN:-}" | tr -d '[:space:]')"
          export GH_TOKEN
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TAP_SYNC_TOKEN is not set. Mint a fine-grained PAT scoped to this repo (Contents + Pull requests: read/write) and add it as a repository secret named TAP_SYNC_TOKEN."
            exit 1
          fi
          BRANCH="formula/v${VERSION}"
          git config user.name "sparkey-release"
          git config user.email "release@sparkey.ai"
          git checkout -b "$BRANCH"
          git add Formula/sparkey.rb
          git commit -m "sparkey v${VERSION}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "PR for $BRANCH already open — updated its branch"; exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "sparkey v${VERSION}" \
            --body "Rendered from https://install.sparkey.ai/latest.json by the scheduled sync. Binaries and SHA256s come from the release mirror; review and merge to publish."
